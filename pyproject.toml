[project]
name = "openjiuwen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.11.12",
    "mcp==1.12.2",
    "pydantic==2.11.5",
    "python-dateutil==2.9.0.post0",
    "sqlalchemy==2.0.41",
    "openai==1.108.0",
    "requests==2.32.3",
    "httpx==0.27.0",
    "cacheout==0.16.0",
    "mermaid-py==0.8.0",
    "numpy==1.26.0",
    "pymupdf==1.26.4",
    "elasticsearch==8.17.1",
    "llama-index==0.12.36",
    "llama-index-vector-stores-elasticsearch==0.4.3", 
    "transformers==4.52.4",
    "portalocker==3.2.0",
    "pymilvus==2.6.4"
]

[tool.uv]
default-groups = ['dev']

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[dependency-groups]
dev = [
    "autodoc-pydantic==2.2.0",
    "coverage==7.7.1",
    "pytest==8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-html>=4.1.1",
    "pytest-mock==3.14.0",
    "ruff==0.11.2"
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["jiuwen"]
addopts = ["-v", "--html=report/index.html", "--self-contained-html"]