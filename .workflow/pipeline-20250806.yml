version: '1.0'
name: pipeline-20250806
displayName: agentcore
triggers:
  trigger: auto
  pr:
    branches:
      include:
        - (develop|release\/0\.3\.0)
stages:
  - name: stage-c019e95c
    displayName: 单元测试
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: ut@python
        name: unit_test_python
        displayName: Python 单元测试
        pythonVersion: '3.11'
        commands:
          - '#!/bin/bash'
          - ''
          - '# 1. 安装所有必要的编译依赖，包括 sqlite3'
          - echo "=== Installing build dependencies ==="
          - sudo apt-get update -y
          - sudo apt-get install -y build-essential zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev wget libsqlite3-dev
          - ''
          - '# 2. 下载 Python 3.11 的源码'
          - echo "=== Downloading Python 3.11 source code ==="
          - PYTHON_VERSION="3.11.9"
          - wget https://www.python.org/ftp/python/$PYTHON_VERSION/Python-$PYTHON_VERSION.tgz
          - tar -xf Python-$PYTHON_VERSION.tgz
          - cd Python-$PYTHON_VERSION
          - ''
          - '# 3. 配置、编译和安装'
          - echo "=== Configuring and building Python ==="
          - ./configure --enable-optimizations --prefix=/usr/local/python3.11_new
          - make -j $(nproc)
          - sudo make altinstall
          - ''
          - '# 4. 使用新编译的 Python 来执行后续步骤'
          - echo "=== Using newly built Python ==="
          - /usr/local/python3.11_new/bin/python3.11 -m pip install uv -i https://mirrors.aliyun.com/pypi/simple/
          - /usr/local/python3.11_new/bin/uv sync --all-extras
          - /usr/local/python3.11_new/bin/uv run pytest
        report:
          path: report
          index: index.html
        checkpoints:
          - key: TestPassRate
            value: 80
            logicalOperator: '&&'
            relationalOperator: '>='
        caches: []
        notify: []
        strategy:
          retry: '0'
