version: '1.0'
name: pipeline-20250806
displayName: agentcore
triggers:
  trigger: auto
  pr:
    branches:
      include:
        - (develop|release\/0\.3\.0)
stages:
  - name: stage-c019e95c
    displayName: 单元测试
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: ut@python
        name: unit_test_python
        displayName: Python 单元测试
        pythonVersion: '3.11'
        commands:
          - '#!/bin/bash'
          - ''
          - '# 1. 确保系统依赖已安装 (这一步仍然需要)'
          - echo "=== Installing system dependencies (SQLite3) ==="
          - apt-get update -y
          - apt-get install -y libsqlite3-dev
          - ''
          - '# 2. 使用系统默认的 pip3 安装 uv'
          - echo "=== Installing uv using system pip ==="
          - pip3 install uv -i https://mirrors.aliyun.com/pypi/simple/
          - ''
          - '# 3. 使用 uv 同步依赖 (uv 会自动使用它所安装的 Python 环境，通常是系统默认的)'
          - echo "=== Syncing dependencies with uv ==="
          - uv sync --all-extras
          - ''
          - '# 4. 使用 uv run 执行 pytest (uv 会调用正确的 Python 解释器)'
          - echo "=== Running tests with uv ==="
          - uv run pytest
        report:
          path: report
          index: index.html
        checkpoints:
          - key: TestPassRate
            value: 80
            logicalOperator: '&&'
            relationalOperator: '>='
        caches: []
        notify: []
        strategy:
          retry: '0'
